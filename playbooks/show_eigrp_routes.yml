---
- name: Show EIGRP routes
  hosts: gns3_routers
  gather_facts: false

  tasks:
    - name: Show EIGRP routes
      cisco.ios.ios_command:
        commands:
          - show ip route eigrp
      register: output

    - name: Display EIGRP routes
      ansible.builtin.debug:
        var: output.stdout_lines